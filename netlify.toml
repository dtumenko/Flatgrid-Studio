# Netlify build. Bez ovoga bi se objavile samo .md izmene, a stranice
# nikad ne bi bile ponovo generisane.
[build]
  command = "npm run build"
  publish = "."

# /admin bez kose crte na kraju
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
